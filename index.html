<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Game 3D Liên Quân HTML</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: Arial, sans-serif;
            user-select: none;
            background-color: #000;
        }
        #game-canvas {
            width: 100vw;
            height: 100vh;
            display: block;
        }
        /* UI Menu */
        #menu {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            z-index: 10;
        }
        #gold-block-btn {
            width: 120px;
            height: 120px;
            background-color: #ffd700;
            border: 4px solid #fff;
            border-radius: 15px;
            cursor: pointer;
            box-shadow: 0 0 20px #ffd700;
            background-size: cover;
            background-position: center;
            transition: transform 0.2s;
        }
        #gold-block-btn:active {
            transform: scale(0.9);
        }
        /* UI Game */
        #hud {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            font-weight: bold;
            font-size: 16px;
            text-shadow: 1px 1px 3px black;
            display: none;
            z-index: 5;
        }
        /* Controls */
        #joystick-container {
            position: absolute;
            bottom: 30px;
            left: 30px;
            width: 120px;
            height: 120px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            touch-action: none;
            display: none;
            z-index: 5;
        }
        #joystick-knob {
            position: absolute;
            top: 35px;
            left: 35px;
            width: 50px;
            height: 50px;
            background: rgba(255, 255, 255, 0.6);
            border-radius: 50%;
        }
        #action-buttons {
            position: absolute;
            bottom: 30px;
            right: 30px;
            display: none;
            gap: 15px;
            z-index: 5;
        }
        .btn {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            border: 2px solid white;
            color: white;
            font-weight: bold;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 14px;
            touch-action: manipulation;
            cursor: pointer;
        }
        #btn-attack { background: rgba(220, 53, 69, 0.8); }
        #btn-skill { background: rgba(40, 167, 69, 0.8); }
        .cooldown { opacity: 0.5; pointer-events: none; }
    </style>
    <!-- Three.js & GLTFLoader -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>

    <!-- Menu Screen -->
    <div id="menu">
        <h1>GAME MOBA 3D</h1>
        <p>Bấm vào khối vàng để bắt đầu</p>
        <div id="gold-block-btn"></div>
    </div>

    <!-- HUD Game -->
    <div id="hud">
        <div id="player-hp">Máu Tướng (Xanh): 100/100</div>
        <div id="enemy-hp">Máu Địch (Đỏ): 100/100</div>
        <div id="score">Mạng Địch Chết: 0/5 | Mạng Mình Chết: 0/5</div>
    </div>

    <!-- Controls UI -->
    <div id="joystick-container">
        <div id="joystick-knob"></div>
    </div>
    <div id="action-buttons">
        <div id="btn-skill" class="btn">CHIÊU (R)</div>
        <div id="btn-attack" class="btn">ĐÁNH</div>
    </div>

    <script>
        // Setup Menu Image (IMG_0511.jpeg)
        const goldBtn = document.getElementById('gold-block-btn');
        const imgTest = new Image();
        imgTest.src = 'IMG_0511.jpeg';
        imgTest.onload = () => { goldBtn.style.backgroundImage = "url('IMG_0511.jpeg')"; };

        // Game State Variables
        let scene, camera, renderer, gltfLoader;
        let playerGroup, enemyGroup;
        let playerModel, enemyModel;
        let playerHp = 100, enemyHp = 100;
        let playerDeaths = 0, enemyDeaths = 0;
        let isSkillActive = false, skillCooldown = false;
        let dragonModel = null;
        let minions = [];
        let enemyProjectiles = [];

        // Joystick Controls
        let moveVec = { x: 0, y: 0 };
        const mainBasePos = new THREE.Vector3(0, 0, 40);
        const enemyBasePos = new THREE.Vector3(0, 0, -40);

        function initGame() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87ceeb);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            // Lighting
            const ambientLight = new THREE.AmbientLight(0xffffff, 1.2);
            scene.add(ambientLight);
            const dirLight = new THREE.DirectionalLight(0xffffff, 1.0);
            dirLight.position.set(20, 50, 20);
            scene.add(dirLight);

            gltfLoader = new THREE.GLTFLoader();

            // Groups làm gốc tọa độ cho Tướng
            playerGroup = new THREE.Group();
            enemyGroup = new THREE.Group();
            scene.add(playerGroup);
            scene.add(enemyGroup);

            // 1. Load Map (5v5_game_map.glb)
            gltfLoader.load('5v5_game_map.glb', (gltf) => {
                scene.add(gltf.scene);
            }, undefined, () => {
                // Fallback Map: Mặt đất + Trụ
                const ground = new THREE.Mesh(new THREE.BoxGeometry(100, 1, 100), new THREE.MeshLambertMaterial({ color: 0x3b7a57 }));
                ground.position.y = -0.5;
                scene.add(ground);
                createTurrets();
            });

            // 2. Load Player (bijan_arena_of_valor.glb)
            gltfLoader.load('bijan_arena_of_valor.glb', (gltf) => {
                playerModel = gltf.scene;
                playerModel.scale.set(1.5, 1.5, 1.5);
                playerGroup.add(playerModel);
                respawnPlayer();
            }, undefined, () => {
                // Fallback Player (Khối vàng 3D)
                playerModel = new THREE.Mesh(new THREE.BoxGeometry(2, 2, 2), new THREE.MeshLambertMaterial({ color: 0xffd700 }));
                playerGroup.add(playerModel);
                respawnPlayer();
            });

            // 3. Load Enemy (preyta_arena_of_valor.glb)
            gltfLoader.load('preyta_arena_of_valor.glb', (gltf) => {
                enemyModel = gltf.scene;
                enemyModel.scale.set(1.5, 1.5, 1.5);
                enemyGroup.add(enemyModel);
                respawnEnemy();
            }, undefined, () => {
                // Fallback Enemy (Khối đỏ 3D)
                enemyModel = new THREE.Mesh(new THREE.BoxGeometry(2, 2, 2), new THREE.MeshLambertMaterial({ color: 0xff0000 }));
                enemyGroup.add(enemyModel);
                respawnEnemy();
            });

            // Timers & Spawners
            setInterval(enemyAttackLogic, 5000); // Địch phun chiêu mỗi 5s
            setInterval(spawnMinions, 15000);    // Spawn lính mỗi 15s
            spawnMinions();

            setupControls();
            animate();
        }

        function createTurrets() {
            const paths = [-20, 0, 20];
            paths.forEach(x => {
                // Trụ phe ta (Xanh)
                const tFriendly = new THREE.Mesh(new THREE.CylinderGeometry(1, 1, 5), new THREE.MeshLambertMaterial({ color: 0x0000ff }));
                tFriendly.position.set(x, 2.5, 15);
                scene.add(tFriendly);

                // Trụ địch (Đỏ)
                const tEnemy = new THREE.Mesh(new THREE.CylinderGeometry(1, 1, 5), new THREE.MeshLambertMaterial({ color: 0xff0000 }));
                tEnemy.position.set(x, 2.5, -15);
                scene.add(tEnemy);
            });
        }

        function respawnPlayer() {
            playerGroup.position.copy(mainBasePos);
            playerHp = 100;
            updateHUD();
        }

        function respawnEnemy() {
            enemyGroup.position.copy(enemyBasePos);
            enemyHp = 100;
            updateHUD();
        }

        // Spawn Lính 2 phe
        function spawnMinions() {
            for (let i = 0; i < 5; i++) {
                // Lính Ta (Màu Xanh)
                const mFriendly = new THREE.Mesh(new THREE.BoxGeometry(1, 1, 1), new THREE.MeshLambertMaterial({ color: 0x00ffff }));
                mFriendly.position.set(-10 + i * 5, 0.5, 35);
                mFriendly.userData = { isEnemy: false, hp: 20 };
                scene.add(mFriendly);
                minions.push(mFriendly);

                // Lính Địch (Màu Đỏ)
                const mEnemy = new THREE.Mesh(new THREE.BoxGeometry(1, 1, 1), new THREE.MeshLambertMaterial({ color: 0x880000 }));
                mEnemy.position.set(-10 + i * 5, 0.5, -35);
                mEnemy.userData = { isEnemy: true, hp: 20 };
                scene.add(mEnemy);
                minions.push(mEnemy);
            }
        }

        // Địch Phun Chiêu (minecraft_slime.glb)
        function enemyAttackLogic() {
            if (enemyHp <= 0) return;

            gltfLoader.load('minecraft_slime.glb', (gltf) => {
                const slime = gltf.scene;
                slime.scale.set(0.8, 0.8, 0.8);
                createProjectile(slime);
            }, undefined, () => {
                // Fallback Chiêu
                const proj = new THREE.Mesh(new THREE.BoxGeometry(1, 1, 1), new THREE.MeshLambertMaterial({ color: 0x00ff00 }));
                createProjectile(proj);
            });
        }

        function createProjectile(proj) {
            proj.position.copy(enemyGroup.position);
            scene.add(proj);
            const dir = new THREE.Vector3().subVectors(playerGroup.position, enemyGroup.position).normalize();
            enemyProjectiles.push({ mesh: proj, dir: dir, life: 120 });
        }

        // Chiêu cưỡi Rồng/Xe Bijan (holy_dragon_arena_of_valor.glb)
        function activateBijanSkill() {
            if (skillCooldown || isSkillActive) return;
            isSkillActive = true;
            skillCooldown = true;

            const btnSkill = document.getElementById('btn-skill');
            btnSkill.classList.add('cooldown');

            gltfLoader.load('holy_dragon_arena_of_valor.glb', (gltf) => {
                dragonModel = gltf.scene;
                dragonModel.scale.set(1.5, 1.5, 1.5);
                mountDragon();
            }, undefined, () => {
                // Fallback Khối to
                dragonModel = new THREE.Mesh(new THREE.BoxGeometry(3, 1.5, 4), new THREE.MeshLambertMaterial({ color: 0xffff00 }));
                mountDragon();
            });

            setTimeout(() => {
                skillCooldown = false;
                btnSkill.classList.remove('cooldown');
            }, 5000);
        }

        function mountDragon() {
            playerGroup.add(dragonModel);
            if (playerModel) playerModel.position.y = 1.5; // Đứng lên rồng/xe
        }

        function dismantleDragon() {
            if (!isSkillActive) return;
            isSkillActive = false;
            if (dragonModel) {
                playerGroup.remove(dragonModel);
                dragonModel = null;
            }
            if (playerModel) playerModel.position.y = 0;
        }

        // Đánh thường (Đánh gần)
        function performAttack() {
            if (playerGroup.position.distanceTo(enemyGroup.position) < 4) {
                enemyHp -= 10;
                if (enemyHp <= 0) {
                    enemyDeaths++;
                    respawnEnemy();
                    checkGameOver();
                }
                updateHUD();
            }
        }

        function checkGameOver() {
            if (enemyDeaths >= 5) {
                alert("BẠN ĐÃ THẮNG!");
                resetGame();
            } else if (playerDeaths >= 5) {
                alert("BẠN ĐÃ THUA!");
                resetGame();
            }
        }

        function resetGame() {
            playerDeaths = 0;
            enemyDeaths = 0;
            respawnPlayer();
            respawnEnemy();
        }

        function updateHUD() {
            document.getElementById('player-hp').innerText = `Máu Tướng (Xanh): ${Math.max(0, playerHp)}/100`;
            document.getElementById('enemy-hp').innerText = `Máu Địch (Đỏ): ${Math.max(0, enemyHp)}/100`;
            document.getElementById('score').innerText = `Mạng Địch Chết: ${enemyDeaths}/5 | Mạng Mình Chết: ${playerDeaths}/5`;
        }

        // Joystick Controls & Event
        function setupControls() {
            const joystick = document.getElementById('joystick-container');
            const knob = document.getElementById('joystick-knob');
            let joystickActive = false;
            let origin = { x: 0, y: 0 };

            joystick.addEventListener('touchstart', (e) => {
                joystickActive = true;
                origin = { x: e.touches[0].clientX, y: e.touches[0].clientY };
            });

            window.addEventListener('touchmove', (e) => {
                if (!joystickActive) return;
                const touch = e.touches[0];
                const dx = touch.clientX - origin.x;
                const dy = touch.clientY - origin.y;
                const dist = Math.min(Math.hypot(dx, dy), 40);
                const angle = Math.atan2(dy, dx);
                
                knob.style.transform = `translate(${Math.cos(angle) * dist}px, ${Math.sin(angle) * dist}px)`;
                moveVec = { x: Math.cos(angle) * (dist / 40), y: Math.sin(angle) * (dist / 40) };
            });

            window.addEventListener('touchend', () => {
                joystickActive = false;
                knob.style.transform = 'translate(0px, 0px)';
                moveVec = { x: 0, y: 0 };
            });

            document.getElementById('btn-attack').addEventListener('click', performAttack);
            document.getElementById('btn-skill').addEventListener('click', activateBijanSkill);
        }

        // Loop Game Main
        function animate() {
            requestAnimationFrame(animate);

            const speed = isSkillActive ? 0.4 : 0.2;

            // Di chuyển Tướng Ta
            if (moveVec.x !== 0 || moveVec.y !== 0) {
                playerGroup.position.x += moveVec.x * speed;
                playerGroup.position.z += moveVec.y * speed;
                playerGroup.rotation.y = Math.atan2(-moveVec.x, -moveVec.y);
            }

            // Tướng Địch đuổi theo Tướng Ta
            if (enemyGroup) {
                const dirToPlayer = new THREE.Vector3().subVectors(playerGroup.position, enemyGroup.position).normalize();
                enemyGroup.position.add(dirToPlayer.multiplyScalar(0.08));
                enemyGroup.lookAt(playerGroup.position);
            }

            // Chiêu Bijan tông Địch
            if (isSkillActive) {
                if (playerGroup.position.distanceTo(enemyGroup.position) < 3) {
                    enemyHp -= 30; // Trừ 30% máu
                    dismantleDragon();
                    if (enemyHp <= 0) {
                        enemyDeaths++;
                        respawnEnemy();
                        checkGameOver();
                    }
                    updateHUD();
                }
            }

            // Xử lý đạn Địch (Slime)
            for (let i = enemyProjectiles.length - 1; i >= 0; i--) {
                let p = enemyProjectiles[i];
                p.mesh.position.add(p.dir.clone().multiplyScalar(0.3));
                p.life--;

                if (p.mesh.position.distanceTo(playerGroup.position) < 2) {
                    playerHp -= 10;
                    scene.remove(p.mesh);
                    enemyProjectiles.splice(i, 1);
                    if (playerHp <= 0) {
                        playerDeaths++;
                        respawnPlayer();
                        checkGameOver();
                    }
                    updateHUD();
                    continue;
                }

                if (p.life <= 0) {
                    scene.remove(p.mesh);
                    enemyProjectiles.splice(i, 1);
                }
            }

            // Xử lý Lính 2 bên đánh lẫn nhau và tấn công Tướng
            for (let i = minions.length - 1; i >= 0; i--) {
                let m = minions[i];
                if (!m) continue;

                let isEngaged = false;

                // Lính đánh Lính khác phe
                for (let j = 0; j < minions.length; j++) {
                    let target = minions[j];
                    if (target && m.userData.isEnemy !== target.userData.isEnemy) {
                        if (m.position.distanceTo(target.position) < 2) {
                            target.userData.hp -= 0.1; // Gây sát thương liên tục
                            isEngaged = true;

                            if (target.userData.hp <= 0) {
                                scene.remove(target);
                                minions.splice(j, 1);
                            }
                            break;
                        }
                    }
                }

                // Nếu lính chưa chạm mặt lính địch thì di chuyển tiếp
                if (!isEngaged) {
                    if (m.userData.isEnemy) {
                        m.position.z += 0.05; // Lính địch đi xuống
                        if (m.position.distanceTo(playerGroup.position) < 1.5) {
                            playerHp -= 0.05;
                            updateHUD();
                        }
                    } else {
                        m.position.z -= 0.05; // Lính ta đi lên
                        if (m.position.distanceTo(enemyGroup.position) < 1.5) {
                            enemyHp -= 0.05;
                            updateHUD();
                        }
                    }
                }
            }

            // Camera đi theo Player
            camera.position.set(playerGroup.position.x, playerGroup.position.y + 20, playerGroup.position.z + 20);
            camera.lookAt(playerGroup.position);

            renderer.render(scene, camera);
        }

        // Bắt đầu game khi nhấn vào khối vàng ở Menu
        document.getElementById('gold-block-btn').addEventListener('click', () => {
            document.getElementById('menu').style.display = 'none';
            document.getElementById('hud').style.display = 'block';
            document.getElementById('joystick-container').style.display = 'block';
            document.getElementById('action-buttons').style.display = 'flex';
            initGame();
        });
    </script>
</body>
</html>
