<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dịch Chuyển Tàng Hình - Three.js Fix</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: sans-serif;
    }
    #ui {
      position: absolute;
      top: 10px;
      left: 10px;
      color: #fff;
      background: rgba(0, 0, 0, 0.7);
      padding: 12px;
      border-radius: 8px;
      user-select: none;
    }
    button {
      cursor: pointer;
      padding: 6px 12px;
      margin-top: 5px;
    }
  </style>
  <!-- Nhúng thư viện Three.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <div id="ui">
    <div><strong>Điều khiển:</strong> Phím WASD để di chuyển</div>
    <div><strong>Trạng thái:</strong> <span id="status">Bình thường</span></div>
    <button id="toggleStealth">Bật / Tắt Tàng Hình (Phím E)</button>
  </div>

  <script>
    // 1. TẠO SCENE, CAMERA, RENDERER
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x1a1a24);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 10, 15);
    camera.lookAt(0, 0, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    // ÁNH SÁNG
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
    scene.add(ambientLight);
    const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
    dirLight.position.set(10, 20, 10);
    scene.add(dirLight);

    // SÀN ĐẤT
    const grid = new THREE.GridHelper(30, 30, 0x444444, 0x222222);
    scene.add(grid);

    // 2. TẠO NHÂN VẬT & MESH
    const geometry = new THREE.BoxGeometry(1, 2, 1);
    const material = new THREE.MeshStandardMaterial({
      color: 0x00ff88,
      transparent: true, // Cho phép chỉnh độ trong suốt khi tàng hình
      opacity: 1.0
    });
    const player = new THREE.Mesh(geometry, material);
    player.position.y = 1;
    scene.add(player);

    // TRẠNG THÁI TÀNG HÌNH & DI CHUYỂN
    let isStealth = false;
    const keys = {};
    const speed = 0.15;

    // 3. XỬ LÝ BẬT / TẮT TÀNG HÌNH (SỬA LỖI MẤT MESH / MẤT DỊCH CHUYỂN)
    function toggleStealth() {
      isStealth = !isStealth;
      const statusText = document.getElementById('status');

      if (isStealth) {
        // KHÔNG dùng player.visible = false (vì sẽ làm mất nhận diện/hiệu ứng)
        // Thay vào đó dùng opacity mờ nhẹ để vẫn quan sát vị trí dịch chuyển
        player.material.opacity = 0.25; 
        statusText.innerText = 'Đang Tàng Hình (Mờ 25%)';
        statusText.style.color = '#00ffff';
      } else {
        player.material.opacity = 1.0;
        statusText.innerText = 'Bình thường';
        statusText.style.color = '#ffffff';
      }
    }

    // HIỆU ỨNG VỆT DỊCH CHUYỂN (TRAIL) KHU TÀNG HÌNH
    function createGhostTrail() {
      if (!isStealth) return;

      const ghostGeo = player.geometry.clone();
      const ghostMat = new THREE.MeshBasicMaterial({
        color: 0x00ffff,
        transparent: true,
        opacity: 0.15,
        wireframe: true
      });
      const ghost = new THREE.Mesh(ghostGeo, ghostMat);
      ghost.position.copy(player.position);
      scene.add(ghost);

      // Tự biến mất vệt bóng mờ sau 300ms
      setTimeout(() => {
        scene.remove(ghost);
        ghostGeo.dispose();
        ghostMat.dispose();
      }, 300);
    }

    // 4. LOGIC DỊCH CHUYỂN (TRANSLATION LOGIC)
    function updateMovement() {
      let moved = false;

      if (keys['KeyW'] || keys['ArrowUp']) { player.position.z -= speed; moved = true; }
      if (keys['KeyS'] || keys['ArrowDown']) { player.position.z += speed; moved = true; }
      if (keys['KeyA'] || keys['ArrowLeft']) { player.position.x -= speed; moved = true; }
      if (keys['KeyD'] || keys['ArrowRight']) { player.position.x += speed; moved = true; }

      // Tạo vệt bóng mờ mỗi khi nhân vật dịch chuyển lúc đang tàng hình
      if (moved && isStealth && Math.random() < 0.3) {
        createGhostTrail();
      }

      // Gắn Camera đi theo nhân vật
      camera.position.x = player.position.x;
      camera.position.z = player.position.z + 15;
    }

    // 5. EVENT LISTENERS
    window.addEventListener('keydown', (e) => {
      keys[e.code] = true;
      if (e.code === 'KeyE') toggleStealth();
    });

    window.addEventListener('keyup', (e) => {
      keys[e.code] = false;
    });

    document.getElementById('toggleStealth').addEventListener('click', toggleStealth);

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // 6. GAME LOOP
    function animate() {
      requestAnimationFrame(animate);
      updateMovement(); // Dịch chuyển vẫn luôn được cập nhật độc lập với trạng thái hiển thị
      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
</html>
